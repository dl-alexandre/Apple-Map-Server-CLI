version: 2

project_name: ams

builds:
  - id: ams
    main: ./cmd/ams
    binary: ams
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/dl-alexandre/Apple-Map-Server-CLI/internal/version.Version={{.Version}}
      - -X github.com/dl-alexandre/Apple-Map-Server-CLI/internal/version.Commit={{.Commit}}
      - -X github.com/dl-alexandre/Apple-Map-Server-CLI/internal/version.Date={{.Date}}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: blake3

release:
  github:
    owner: dl-alexandre
    name: Apple-Map-Server-CLI
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"

brews:
  - name: ams
    repository:
      owner: dl-alexandre
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
      branch: master
      pull_request:
        enabled: false
    commit_author:
      name: goreleaserbot
      email: bot@dl-alexandre.com
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    directory: Formula
    homepage: https://github.com/dl-alexandre/Apple-Map-Server-CLI
    description: Apple Map Server CLI
    license: MIT
    skip_upload: "{{ if index .Env \"HOMEBREW_TAP_TOKEN\" }}false{{ else }}true{{ end }}"
    test: |
      system "#{bin}/ams", "version"
    install: |
      bin.install "ams"

flatpak:
  - app_id: net.ddns.dl-alexandre.AMSCLI
    runtime: org.freedesktop.Platform
    runtime_version: "24.08"
    sdk: org.freedesktop.Sdk
    finish_args:
      - --share=network
      - --filesystem=home

srpm:
  enabled: true
  summary: "Apple Map Server CLI"
  license: MIT
  url: https://github.com/dl-alexandre/Apple-Map-Server-CLI

scoops:
  - repository:
      owner: dl-alexandre
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
      branch: main
      pull_request:
        enabled: false
    commit_author:
      name: goreleaserbot
      email: bot@dl-alexandre.com
    commit_msg_template: "Scoop update for {{ .ProjectName }} version {{ .Tag }}"
    directory: bucket
    description: "CLI for Apple Map Server API"
    homepage: "https://github.com/dl-alexandre/Apple-Map-Server-CLI"
    license: MIT
    skip_upload: "{{ if index .Env \"SCOOP_BUCKET_TOKEN\" }}false{{ else }}true{{ end }}"
